name: Release @seams/wallet-voice-sign

# The Speak-to-Sign host plugin (@seams/wallet-voice-sign, in packages/wallet-voice-sign; up to
# 0.66.0 its npm name was @seams/speak-to-sign, published by this workflow under its old file
# name release-speak-to-sign.yml) is released after the Seams Wallet packages of the same version
# (@seams/wallet and @seams/voiceid, released from seams-tech/seams-wallet). It builds against
# those published packages, so a release fails until they are on npm.
#
# The first version under the new name needs one publish from the owner's npm account, because
# npm allows trusted publishing only for a package that exists (docs/release-0.66.0.md, step 3).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version; the same as the @seams/wallet and @seams/voiceid release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      # A pre-release version must not become the default install.
      NPM_DIST_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}
    defaults:
      run:
        working-directory: packages/wallet-voice-sign
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Validate the versions
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "@seams/wallet-voice-sign"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          for name in @seams/wallet @seams/voiceid; do
            test "$(node -p "require('./package.json').peerDependencies['$name']")" = "$RELEASE_VERSION"
            test "$(node -p "require('./package.json').devDependencies['$name']")" = "$RELEASE_VERSION"
            npm view "$name@$RELEASE_VERSION" version
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: Use npm trusted publishing
        run: npm install --global npm@latest
      - name: Retain the release package
        run: |
          mkdir -p ../../.artifacts/npm
          npm pack --pack-destination ../../.artifacts/npm
      - uses: actions/upload-artifact@v7
        with:
          name: wallet-voice-sign-${{ inputs.version }}-${{ github.sha }}
          path: .artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish @seams/wallet-voice-sign
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
