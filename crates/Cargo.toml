# The workspace of the OutLayer worker (`voice-verifier`).
#
# Cargo hashes the path of each path dependency into the compiled code. A path
# below the workspace root is hashed as a relative path, and any other path as
# an absolute one. This root makes `../spoken-intent` a relative path, so the
# WASM hash does not depend on the folder of the clone (see
# voice-verifier/build.sh).
#
# `spoken-intent` stays outside the workspace, with its own Cargo.lock and
# test dependencies. `speaker-service` has its own `[workspace]`.
[workspace]
resolver = "2"
members = ["voice-verifier"]
exclude = ["spoken-intent", "speaker-service"]

# `tract-onnx` (the feature `local-speaker` of voice-verifier) needs bit-vec.
# The vendored copy removes an optional borsh 1.7 requirement that conflicts
# with the borsh =1.6.1 pin of spoken-intent.
[patch.crates-io]
bit-vec = { path = "voice-verifier/vendor/bit-vec" }
# The NEAR AI attestation check of voice-verifier needs dcap-qvl without
# `serde_json/preserve_order` (see the note in its manifest).
dcap-qvl = { path = "voice-verifier/vendor/dcap-qvl" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
