[package]
name = "seams-voice-verdict"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Checks a signed Speak-to-Sign voice verdict: for a server, or for a contract with its own ed25519 check"
license = "Apache-2.0"

# Its own workspace, so that it is not part of the OutLayer worker workspace
# (../Cargo.toml) and does not change that build.
[workspace]

[lib]
name = "voice_verdict"
path = "src/lib.rs"

[features]
default = ["dalek"]
# `check_verdict` with the ed25519 check of `ed25519-dalek`. A contract turns
# it off and passes the check of its host to `check_verdict_with`.
dalek = ["dep:ed25519-dalek"]

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
# Checks in a test that the real quotes of the fixtures chain to Intel, with the
# collateral of Intel PCS that is stored next to them. No network.
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
