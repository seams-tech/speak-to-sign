[package]
name = "seams-voice-verifier"
version = "0.13.0"
edition = "2021"
publish = false
description = "Speak-to-Sign OutLayer worker: enroll a voice and verify a spoken request, with a signed verdict"
# The workspace root and the release profile are in ../Cargo.toml.

[lib]
name = "seams_voice_verifier"
path = "src/lib.rs"

[[bin]]
name = "seams-voice-verifier"
path = "src/main.rs"

[dependencies]
spoken-intent = { path = "../spoken-intent" }
sha2 = "=0.10.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks the speaker service signature over each embedding.
ed25519-dalek = { version = "2", default-features = false }
# Opens the sealed audio (see src/envelope.rs). No `getrandom`: the worker
# only opens.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }

# ReDimNet B1 inside the worker (the feature `local-speaker`).
tract-onnx = { version = "=0.23.10", optional = true }

[features]
# The speaker model runs inside the worker: `tract` is in the WASM, and the
# worker fetches the model with its pinned digest on each run. Without the
# feature, the embeddings come from the speaker service (Phala). See
# README.md, "Two variants".
local-speaker = ["dep:tract-onnx"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys"] }
# The `wasi:http` bindings for the parallel POSTs (see src/wasm_host/http_batch.rs).
wasi = "=0.13.3"

