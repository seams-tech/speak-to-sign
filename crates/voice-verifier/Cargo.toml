[package]
name = "seams-voice-verifier"
version = "0.14.0"
edition = "2021"
publish = false
description = "Speak-to-Sign OutLayer worker: enroll a voice and verify a spoken request, with a signed verdict"
# The workspace root and the release profile are in ../Cargo.toml.

[lib]
name = "seams_voice_verifier"
path = "src/lib.rs"

[[bin]]
name = "seams-voice-verifier"
path = "src/main.rs"

[dependencies]
spoken-intent = { path = "../spoken-intent" }
sha2 = "=0.10.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Checks the speaker service signature over each embedding.
ed25519-dalek = { version = "2", default-features = false }
# Opens the sealed audio (see src/envelope.rs). No `getrandom`: the worker
# only opens.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
# Oblivious HTTP to the NEAR AI gateway (see src/ohttp.rs): the response
# key of RFC 9458. The same versions as the dependencies of `hpke`.
hkdf = { version = "=0.13.0", default-features = false }
sha2_11 = { package = "sha2", version = "=0.11.1", default-features = false }
chacha20poly1305 = { version = "=0.11.0", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }
# ECDSA P-256 for the TDX quote check of the NEAR AI gateway and of its
# Whisper model (see src/tdx_quote.rs and src/x509.rs): Intel's certificates,
# CRLs and collateral, and the quote. No precomputed tables: they add size.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }

# ReDimNet B1 inside the worker (the feature `local-speaker`).
tract-onnx = { version = "=0.23.10", optional = true }

[dev-dependencies]
# The reference for tests/tdx_quote.rs: `dcap-qvl` checks the same quotes,
# and the test compares the results. The worker itself does not use it.
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509", "danger-allow-tcb-override"] }
# The reference for the tests of src/x509.rs: the fields of real certificates
# and CRLs. The same versions as the dependencies of `dcap-qvl`.
x509-cert = { version = "=0.3.0", default-features = false }
der = { version = "0.8", default-features = false, features = ["alloc"] }

[features]
# The speaker model runs inside the worker: `tract` is in the WASM, and the
# worker fetches the model with its pinned digest on each run. Without the
# feature, the embeddings come from the speaker service (Phala). See
# README.md, "Two variants".
local-speaker = ["dep:tract-onnx"]
# The words go to Venice AI (`fal-ai/wizper`) in place of NEAR AI: the
# fallback for a NEAR AI Whisper outage. The version is `<version>+venice`.
# See README.md, "Speech-to-text service".
venice = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys"] }
# The `wasi:http` bindings for the parallel POSTs (see src/wasm_host/http_batch.rs).
wasi = "=0.13.3"

