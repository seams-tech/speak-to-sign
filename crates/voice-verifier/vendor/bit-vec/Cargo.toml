# bit-vec 0.10.1 from crates.io (crate SHA-256
# 5727b15fa97d4f4fee0a3b7c3d550ed0269f54329207b86388de918604e31269), sources
# unchanged. This manifest drops the optional `borsh`, `serde` and `miniserde`
# dependencies. Cargo resolves optional dependencies, and bit-vec's optional
# `borsh = "1.7"` conflicts with `spoken-intent`'s `borsh = "=1.6.1"`.
# tract only uses the default `std` feature.

[package]
edition = "2021"
rust-version = "1.85.0"
name = "bit-vec"
version = "0.10.1"
authors = ["Alexis Beingessner <a.beingessner@gmail.com>"]
description = "A vector of bits"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/contain-rs/bit-vec"
autobenches = false
autotests = false
autoexamples = false

[features]
allocator_api = []
default = ["std"]
std = []
# Kept as names so the sources' cfg attributes stay valid; never enabled.
borsh = []
serde = []
miniserde = []

[lib]
name = "bit_vec"
path = "src/lib.rs"
