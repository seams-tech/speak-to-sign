[package]
name = "speak-to-sign-faucet"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A testnet faucet for the Speak-to-Sign demo: one transaction sends an account testnet USDC and testnet NEAR, once"
repository = "https://github.com/seams-tech/speak-to-sign"

# The reproducible build (NEP-330): `cargo near build reproducible-wasm` builds
# the WASM of the committed source in this pinned image, and writes the image,
# the command and the commit into the contract metadata. So NearBlocks can
# build it again and compare. See ../reproducible.sh.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

# A standalone workspace: it must not join a parent workspace.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
