[package]
name = "speak-to-sign-faucet"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A testnet faucet for the Speak-to-Sign demo: one transaction sends an account testnet USDC and testnet NEAR, once"
repository = "https://github.com/seams-tech/speak-to-sign"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

# A standalone workspace: it must not join a parent workspace.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
