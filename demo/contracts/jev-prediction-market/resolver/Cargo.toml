[package]
name = "pm-notes-resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "OutLayer worker for the pm-notes market: asks JEV (Typesafe) or NEAR AI for the probability of YES"
repository = "https://github.com/seams-tech/speak-to-sign"

# A standalone crate: it must not join the contract workspace in the parent folder.
[workspace]

[lib]
name = "pm_notes_resolver"
path = "src/lib.rs"

[[bin]]
name = "pm-notes-resolver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "=0.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
