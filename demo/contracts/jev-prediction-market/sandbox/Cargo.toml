[package]
name = "jev-prediction-market-sandbox"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Sandbox test: deploys the pm-notes release WASM and a fake OutLayer contract to a local nearcore sandbox"

[dev-dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
anyhow = "1"
# The spoken bet test signs verdicts as the voice verifier does.
ed25519-dalek = { version = "=2.2.0", default-features = false }
spoken-intent = { path = "../../../../crates/spoken-intent" }
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"
