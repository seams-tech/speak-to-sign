[package]
name = "voice-multisig"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Voice multisig for the Speak-to-Sign demo: any account proposes a hidden NEAR transfer with a signed voice verdict, checked on chain, and admin accounts approve it"
repository = "https://github.com/seams-tech/speak-to-sign"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
# The multisig commitment and the request digest of each verdict.
spoken-intent = { path = "../../../crates/spoken-intent" }
# The check of a signed voice verdict, with the ed25519 check of the host.
seams-voice-verdict = { path = "../../../crates/voice-verdict", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
# Signs test verdicts with a test key.
ed25519-dalek = { version = "=2.2.0", default-features = false }

# A standalone workspace: it must not join a parent workspace. The sandbox
# test crate is a member so that it shares this lock file and target folder.
[workspace]
members = ["sandbox"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
