# Cloudflare Pages project for the Community Notes demo.
# functions/api/voice-command.ts and functions/api/x/eligible-posts.ts use the secret NEAR_AI_API_KEY
# (NEAR AI's JEV and chat model), or TYPESAFE_API_KEY for JEV at Typesafe.
# functions/api/voice-verify.ts needs the OutLayer settings of the Seams staging verify route:
# VOICE_OUTLAYER_BASE_URL, VOICE_OUTLAYER_PROJECT, VOICE_OUTLAYER_VERSION_KEY (a verifier with
# market_bet), VOICE_OUTLAYER_PAYMENT_KEY (secret), VOICE_OUTLAYER_SECRETS_PROFILE and
# VOICE_OUTLAYER_SECRETS_ACCOUNT_ID.
# Optional: NEAR_RPC_URL. See README.md.
# functions/api/faucet.ts needs the secret FAUCET_PRIVATE_KEY and the KV binding FAUCET_LIMITS.
# functions/api/x/eligible-posts.ts needs the secrets X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN and
# X_ACCESS_TOKEN_SECRET (the OAuth 1.0a keys of a Community Notes AI Note Writer account).
# Its subject filter (JEV) needs TYPESAFE_API_KEY or NEAR_AI_API_KEY, unless X_ELIGIBLE_TOPICS is "all".
# Optional: X_ELIGIBLE_MAX, X_ELIGIBLE_TTL_SECONDS, X_ELIGIBLE_LANG, X_ELIGIBLE_TOPICS and a KV
# binding X_CACHE.
name = "speak-to-sign"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

# One snapshot of /api/x/eligible-posts for all Cloudflare locations, so that the route calls X
# three times a day in all (namespace "seams-voice-intents-x-cache").
[[kv_namespaces]]
binding = "X_CACHE"
id = "1a59a845916b4d119b037adeb871ab6c"

# The accounts that each network (IP address) got from /api/faucet, for its limit of 3
# (namespace "speak-to-sign-faucet-limits"). The faucet does not run without it.
[[kv_namespaces]]
binding = "FAUCET_LIMITS"
id = "2857303a21af46678ef1de86a270caee"

[vars]
# Posts for each call to X (the route's default is 10). X bills each post and author that it
# returns: 30 posts cost $0.45 a call at most. Many posts of a call repeat the last call's, and
# about half of the new posts pass the subject filter (science, technology, business, politics).
X_ELIGIBLE_MAX = "30"
