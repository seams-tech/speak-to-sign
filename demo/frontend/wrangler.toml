# Cloudflare Pages project for the Community Notes demo.
# The Pages Function in functions/api/summary.ts needs the secret NEAR_AI_API_KEY.
# functions/api/voice-verify.ts needs the OutLayer settings of the Seams staging verify route:
# VOICE_OUTLAYER_BASE_URL, VOICE_OUTLAYER_PROJECT, VOICE_OUTLAYER_VERSION_KEY (a verifier with
# multisig_propose), VOICE_OUTLAYER_PAYMENT_KEY (secret), VOICE_OUTLAYER_SECRETS_PROFILE and
# VOICE_OUTLAYER_SECRETS_ACCOUNT_ID.
# functions/api/multisig/approve.ts needs the secrets MULTISIG_ADMIN_A_KEY and
# MULTISIG_ADMIN_B_KEY (function-call keys for approve and execute on the team contract).
# Optional: MULTISIG_ADMIN_A, MULTISIG_ADMIN_B, MULTISIG_CONTRACT and NEAR_RPC_URL. See README.md.
name = "seams-voice-intents"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
