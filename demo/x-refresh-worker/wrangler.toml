# A scheduled Worker for the Speak-to-Sign demo site: it asks the site's X posts route every
# 4 hours, so the route adds the new posts of X to its snapshot also when no one visits. See
# README.md. Deploy it only with the owner's approval.
name = "seams-voice-intents-x-refresh"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Only the schedule runs it. It has no fetch handler, so a public workers.dev URL would only
# answer 500.
workers_dev = false
preview_urls = false

[triggers]
# 00:00, 04:00, 08:00, 12:00, 16:00 and 20:00 UTC. The route calls X when its snapshot is
# about 4 hours old.
crons = ["0 */4 * * *"]

[vars]
SITE_URL = "https://speak-to-sign.pages.dev"
