[package]
name = "gate0-model-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 0 item 1: run the VoiceID ONNX models with tract in wasm32-wasip2"

[dependencies]
tract-onnx = "0.23.10"
anyhow = "1"

[features]
# Embed the four models in the WASM so that its hash covers them (Gate 0 item 2).
embed = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
