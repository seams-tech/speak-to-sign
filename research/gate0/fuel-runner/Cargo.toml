[package]
name = "gate0-fuel-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 0 item 3: run a wasm32-wasip2 component with the OutLayer worker's wasmtime settings and report fuel"

[dependencies]
# The OutLayer worker pins wasmtime 28 (worker/Cargo.toml, out-layer/outlayer main).
wasmtime = { version = "28", features = ["component-model"] }
wasmtime-wasi = "28"
anyhow = "1"
