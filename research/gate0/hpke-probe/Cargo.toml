[package]
name = "gate0-hpke-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 0 item 10: HPKE (X25519, HKDF-SHA256, ChaCha20-Poly1305) in wasm32-unknown-unknown and wasm32-wasip2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The Wallet build takes randomness from crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
