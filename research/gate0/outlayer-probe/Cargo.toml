[package]
name = "gate0-outlayer-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gate 0 items 2-9: an OutLayer worker that answers testnet probes; the models feature times ReDimNet and Aurora in the TEE"

[dependencies]
outlayer = "0.2.1"
serde_json = "1"
wasi-http-client = "0.2"
tract-onnx = { version = "0.23.10", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# Fetch ReDimNet B1 and Aurora INT8 over HTTPS with pinned digests, and enable the infer op.
models = ["dep:tract-onnx", "dep:sha2"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
