[package]
name = "seams-speaker-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "Refactor 210 task F: ReDimNet B1 speaker embeddings, signed with a dstack-derived ed25519 key, for a Phala Cloud dstack CVM"

# A standalone crate: it must not join a parent workspace.
[workspace]

[lib]
name = "seams_speaker_service"
path = "src/lib.rs"

[[bin]]
name = "speaker-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
hex = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tract-onnx = "=0.23.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
