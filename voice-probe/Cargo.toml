[package]
name = "seams-voice-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Refactor 210 task E: an OutLayer worker that times each stage of a voice verify over the HTTPS API"

# A standalone crate: it must not join a parent workspace.
[workspace]

[lib]
name = "seams_voice_probe"
path = "src/lib.rs"

[[bin]]
name = "voice-probe"
path = "src/main.rs"

[features]
default = ["redimnet"]
# Fetch ReDimNet with its pinned digest and run it with tract.
redimnet = ["dep:tract-onnx", "dep:wasi-http-client"]
# Skip ReDimNet and tract: transcription, word check and signature only.
# Build it with `--no-default-features --features tiny` so tract is not in
# the dependency graph at all (build.sh does this).
tiny = []
# With `tiny`: get the speaker embedding from the speaker service (task F)
# at the same time as the NEAR AI transcript, and check its ed25519
# signature. It uses manifest/outlayer-speaker.json. Build it with
# `--no-default-features --features tiny,speaker-service` (build.sh does).
speaker-service = ["dep:ed25519-dalek"]

[dependencies]
ed25519-dalek = { version = "2", default-features = false, optional = true }
spoken-intent = { path = "../spoken-intent" }
sha2 = "=0.10.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys"] }
# The `wasi:http` bindings for the NEAR AI POST (see main.rs, `post`).
wasi = "=0.13.3"
wasi-http-client = { version = "0.2", optional = true }
tract-onnx = { version = "=0.23.10", optional = true }

[patch.crates-io]
# The verifier's vendored bit-vec: it removes an optional borsh 1.7
# requirement that conflicts with spoken-intent's borsh =1.6.1 pin.
bit-vec = { path = "../voice-verifier/vendor/bit-vec" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
