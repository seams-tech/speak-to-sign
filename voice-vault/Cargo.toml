[package]
name = "voice-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Speak-to-Sign vault: native NEAR transfers to saved contacts, paid only on a verdict signed by the pinned OutLayer verifier key"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.21.0"
spoken-intent = { path = "../../seams-wallet/crates/spoken-intent" }

[dev-dependencies]
near-sdk = { version = "=5.21.0", features = ["unit-testing"] }
# Signs test verdicts with the shared vector's test key.
ed25519-dalek = { version = "2", default-features = false }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.0"
image_digest = "sha256:a9d8bee7b134856cc8baa142494a177f2ba9ecfededfcdd38f634e14cca8aae2"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
