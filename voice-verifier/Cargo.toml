[package]
name = "seams-voice-verifier"
version = "0.4.1"
edition = "2021"
publish = false
description = "Speak-to-Sign OutLayer worker: enroll a voice and verify a spoken request, with a signed verdict"

# A standalone crate: it must not join a parent workspace.
[workspace]

[lib]
name = "seams_voice_verifier"
path = "src/lib.rs"

[[bin]]
name = "seams-voice-verifier"
path = "src/main.rs"

[dependencies]
spoken-intent = { path = "../spoken-intent" }
sha2 = "=0.10.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks the speaker service signature over each embedding.
ed25519-dalek = { version = "2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys"] }
# The `wasi:http` bindings for the parallel POSTs (see main.rs).
wasi = "=0.13.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
